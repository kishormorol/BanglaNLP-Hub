- id: bemoc
  name: BEmoC
  task: sentiment
  size: 7,000 texts
  sizeN: 7000
  license: Research only
  year: 2022
  source: Emotion classification corpus
  link: https://github.com/avishek-018/BEmoC
  verified: 2026-07-19
  desc: Six-class emotion corpus (anger, disgust, fear, joy, sadness, surprise).
  bibtex: |-
    @Article{Iqbal2022,
    author="Iqbal, MD. Asif
    and Das, Avishek
    and Sharif, Omar
    and Hoque, Mohammed Moshiul
    and Sarker, Iqbal H.",
    title="BEmoC: A Corpus for Identifying Emotion in Bengali Texts",
    journal="SN Computer Science",
    year="2022",
    month="Jan",
    day="17",
    volume="3",
    number="2",
    pages="135",
    abstract="Emotion classification in text has growing interest among NLP experts due to the enormous availability of people's emotions and its emergence on various Web 2.0 applications/services. Emotion classification in the Bengali texts is also gradually being considered as an important task for sports, e-commerce, entertainments, and security applications. However, It is a very critical task to develop an automatic emotion classification system for low-resource languages such as, Bengali. Scarcity of resources and deficiency of benchmark corpora make the task more complicated. Thus, the development of a benchmark corpus is the prerequisite to develop an emotion classifier for Bengali texts. This paper describes the development of an emotional corpus (hereafter called `BEmoC') for classifying six emotions in Bengali texts. The corpus development process consists of four key steps: data crawling, pre-processing, labelling, and verification. A total of 7000 texts are labelled into six basic emotion categories such as anger, fear, surprise, sadness, joy, and disgust, respectively. Dataset evaluation with 0.969 Cohen's $\kappa$ score indicates the close agreement between the corpus annotators and the expert. The analysis of evaluation also represents that the distribution of emotion words obeys Zipf's law. Moreover, the results of BEmoC analysis shown in terms of coding reliability, emotion density, and most frequent emotion words, respectively.",
    issn="2661-8907",
    doi="10.1007/s42979-022-01028-w",
    url="https://doi.org/10.1007/s42979-022-01028-w"
    }
